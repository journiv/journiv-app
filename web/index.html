    <title>Journiv - Private Journal</title>

    <script src="flutter_bootstrap.js?v=1779727103" defer></script>

    <style>
      html,
      body {
        background-color: #16181d;
        height: 100%;
        margin: 0;
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: #ffffff;
        }
      }

      @keyframes spin {
        0% {
          transform: rotate(0);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        #loading {
          background: #121212;
        }
        #loading div {
          color: #eee;
        }
      }
    </style>
  </head>

  <body>
    <div
      id="loading"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #f5f5f5;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      "
    >
      <div
        style="
          text-align: center;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
            sans-serif;
          color: #333;
        "
      >
        <div
          style="
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #0175c2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
          "
        ></div>
        <div id="loading-text">Loading Journiv...</div>
      </div>
    </div>

    <noscript>
      <p style="text-align: center; margin-top: 20px">
        Journiv requires JavaScript to run. Please enable it to continue.
      </p>
    </noscript>

    <script>
      // Loading Text Animation
      window.addEventListener("flutter-first-frame", () => {
        const l = document.getElementById("loading");
        if (l) l.style.display = "none";
      });

      const text = document.getElementById("loading-text");
      let dots = 0;
      const loadingInterval = setInterval(() => {
        if (text) {
          dots = (dots + 1) % 4;
          text.textContent = "Loading Journiv" + ".".repeat(dots);
        } else {
          clearInterval(loadingInterval);
        }
      }, 500);

      // Update theme color dynamically for Android / desktop
      const metaTheme = document.querySelector("#theme-color-meta");
      const light = "#FFFFFF";
      const dark = "#16181D";

      function updateThemeColor() {
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        metaTheme.setAttribute("content", prefersDark ? dark : light);
        document.documentElement.style.backgroundColor = prefersDark
          ? dark
          : light;
        document.body.style.backgroundColor = prefersDark ? dark : light;
      }

      updateThemeColor();
      window
        .matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", updateThemeColor);
    </script>
  </body>
