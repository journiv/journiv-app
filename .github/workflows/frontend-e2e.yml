name: Frontend E2E

# Manual only for now. The suite is new; it gates nothing until it has shown it
# is stable. Enabling PR gating later is a trigger change, not a redesign —
# uncomment the `pull_request` block below and nothing else needs to move.
on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - "frontend/**"
  #     - "app/**"
  #     - ".github/workflows/frontend-e2e.yml"

permissions:
  contents: read

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright smoke suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # ----- Backend -------------------------------------------------------
      # E2E runs against a real Journiv backend; only external services are
      # ever mocked. This reuses the image build and compose overlay that
      # integration-tests.yml already relies on.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Journiv Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: swalabtech/journiv-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Create backend environment file
        run: |
          cat > .env <<EOF
          SECRET_KEY=test-secret-key-for-ci-only-not-for-production
          DOMAIN_NAME=localhost
          DOMAIN_SCHEME=http
          APP_PORT=8000
          ENVIRONMENT=production
          DEBUG=false
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/0
          ENABLE_CORS=false
          DATABASE_URL=sqlite:////data/journiv.db
          # Each Playwright worker registers its own throwaway account. The
          # backend allows 3 registrations and 5 logins per minute by default,
          # which a parallel run exceeds immediately.
          RATE_LIMITING_ENABLED=false
          DISABLE_SIGNUP=false
          EOF

      - name: Start the backend
        run: |
          APP_VERSION=latest docker compose \
            -f docker-compose.sqlite.yml \
            -f docker-compose.override.ci.yml \
            --env-file .env up -d

      - name: Wait for the backend to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health >/dev/null 2>&1; then
              echo "Backend healthy after ${i} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy. Logs:"
          APP_VERSION=latest docker compose -f docker-compose.sqlite.yml \
            -f docker-compose.override.ci.yml logs app
          exit 1

      # ----- Frontend ------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Only the @smoke tier runs here. As coverage grows, widen this to the
      # P0/P1 set rather than adding a second job.
      - name: Run Playwright smoke suite
        working-directory: frontend
        run: npm run test:e2e:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Backend logs on failure
        if: failure()
        run: |
          APP_VERSION=latest docker compose -f docker-compose.sqlite.yml \
            -f docker-compose.override.ci.yml logs app

      - name: Tear down
        if: always()
        run: |
          APP_VERSION=latest docker compose -f docker-compose.sqlite.yml \
            -f docker-compose.override.ci.yml down -v || true
