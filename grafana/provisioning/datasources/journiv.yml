# Grafana Datasource Provisioning — Journiv (PostgreSQL)
# Auto-loaded on Grafana startup. No manual UI setup needed.
apiVersion: 1

datasources:
  - name: Journiv
    type: postgres
    access: proxy
    url: $JOURNIV_GRAFANA_DB_URL
    database: $JOURNIV_GRAFANA_DB_NAME
    user: $JOURNIV_GRAFANA_DB_USER
    isDefault: true
    editable: false
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1800   # PostgreSQL 18.x
      timescaledb: false
    secureJsonData:
      password: "$POSTGRES_PASSWORD"
