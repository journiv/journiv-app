<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Journiv</title>
    <script>
      (() => {
        const saved = localStorage.getItem("journiv.theme");
        const dark =
          saved === "dark" ||
          (!saved && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!--
        Boot splash: shown while main.tsx awaits the session restore
        (src/api/auth/session.ts) before its first render. React replaces
        this on first render, so it also doubles as the installed app's
        launch screen — see docs/features/pwa.md.
      -->
      <div
        style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--background)"
      >
        <img
          src="/favicon.svg"
          alt="Journiv"
          width="56"
          height="56"
          style="width: 56px; height: 56px"
        />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
