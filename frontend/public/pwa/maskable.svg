<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Journiv</title>
  <!-- Maskable variant of public/favicon.svg for the manifest's `maskable`
       icon purpose (DESIGN.md, "The identity mark"). Android's mask crops to
       an arbitrary shape (circle, squircle, rounded square, …), so this is
       full-bleed Journiv blue #405DE6 with no tile silhouette — the platform
       supplies the shape — and the glyph is scaled/centred to sit inside the
       central 80% "safe zone" circle every launcher respects. Do not add the
       rounded-tile path from favicon.svg here; that is the `any` icon's job.
       Regenerate alongside favicon.svg / favicon.ico / apple-touch-icon.png
       if the mark's geometry ever changes. -->
