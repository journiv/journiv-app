<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Journiv</title>
  <!-- Journiv identity mark. The tile is fixed Journiv blue #405DE6 (NOT the
       themeable --brand token); the "j" is Georgia Italic, outlined so the mark
       needs no font. src/components/journiv/BrandMark.tsx renders the same
       geometry in-app. See DESIGN.md, "The identity mark".

       Rasters of this file: public/favicon.ico (16/32/48, transparent corners)
       and public/apple-touch-icon.png (180, full-bleed #405DE6, opaque — iOS
       masks it). The .ico corners MUST stay transparent; a plain SVG->PNG on
       macOS flattens onto white, so regenerate by rendering this mark over
       solid black and solid white and recovering alpha as
       a = 1 - (white - black) / 255 per channel. -->
