# docker-compose.plus-sidecar.yml
#
# ============================================================================
# Journiv Plus — Sidecar (Air-Gap Configuration)
# ============================================================================
#
# This file isolates Plus features into a separate container with no public
# internet access. The main app proxies Plus requests to the sidecar over an
# internal Docker network that has no external route.
#
# USAGE
# ─────
# Option A — explicit (no rename needed):
#   docker compose -f docker-compose.yml -f docker-compose.plus-sidecar.yml up -d
#
# Option B — drop-in (zero extra flags): Docker applied override files automatically,
# but you must rename this file to docker-compose.override.yml:
#   cp docker-compose.plus-sidecar.yml docker-compose.override.yml
#   docker compose up -d
#
# WHAT THIS DOES
# ──────────────
# 1. Starts journiv-plus (same image, SERVICE_ROLE=plus-service) on a
#    network with no internet gateway (internal: true).
# 2. Adds postgres to that same internal network so the sidecar can reach the DB.
# 3. Patches app/workers to proxy all /plus/* traffic to the sidecar.
# ============================================================================

services:
  # ---------------------------------------------------------------------------
  # The sidecar: air-gapped, DB-only, no internet access
  # ---------------------------------------------------------------------------
  journiv-plus:
    image: swalabtech/journiv-app:${APP_VERSION:-latest}
    container_name: journiv-plus-sidecar
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - journiv-internal # no internet connection, only accessible by other services on this network
    environment:
      SERVICE_ROLE: plus-service
      DB_DRIVER: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # SECRET_KEY is picked up from .env via env_file above
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # postgres must join journiv-internal so the air-gapped sidecar can reach the DB.
  # It retains the backend network for the main app/workers.
  # ---------------------------------------------------------------------------
  postgres:
    networks:
      - backend
      - journiv-internal

  # ---------------------------------------------------------------------------
  # Patch the main app: join internal network + proxy to sidecar.
  # Networks are explicitly listed to preserve existing base file entries.
  # ---------------------------------------------------------------------------
  app:
    networks:
      - backend
      - frontend
      - journiv-internal
    environment:
      PLUS_SERVICE_URL: http://journiv-plus:8000
    depends_on:
      journiv-plus:
        condition: service_healthy

  celery-worker:
    networks:
      - backend
      - journiv-internal
    environment:
      PLUS_SERVICE_URL: http://journiv-plus:8000
    depends_on:
      journiv-plus:
        condition: service_healthy

  celery-beat:
    networks:
      - backend
      - journiv-internal
    environment:
      PLUS_SERVICE_URL: http://journiv-plus:8000
    depends_on:
      journiv-plus:
        condition: service_healthy

networks:
  journiv-internal:
    internal: true # no default route to the outside world
